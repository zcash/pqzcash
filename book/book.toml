[book]
authors = ["Daira-Emma Hopwood"]
description = "Design work towards post-quantum security for Zcash."
language = "en"
src = "src"
title = "Post-Quantum Zcash"

[preprocessor.katex]
macros = "macros.txt"
after = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.todo]
command = "python3 preprocessor-todo.py"
after = ["links"]

[preprocessor.repo-links]
command = "python3 preprocessor-repo-links.py"
after = ["links"]

[output]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js", "todo.js"]
default-theme = "rust"
preferred-dark-theme = "rust"
additional-css = ["custom.css"]
hash-files = true

# The two notes were chapters of a "Working Notes" section until 2026-11-23.
[output.html.redirect]
"/proof-systems/working-notes/pasta-proof-size.html" = "../other-schemes/pasta-proof-size.html"
"/proof-systems/working-notes/zk-fiat-shamir-with-aborts.html" = "../kishu/zk-fiat-shamir-with-aborts.html"
